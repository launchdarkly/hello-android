version: 2
updates:
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'monthly'
    cooldown:
      default-days: 7
      exclude:
        - 'launchdarkly/*'

  - package-ecosystem: 'gradle'
    directory: '/'
    schedule:
      interval: 'monthly'
    cooldown:
      default-days: 7
      exclude:
        - 'com.launchdarkly:*'

  - package-ecosystem: 'gradle'
    directory: '/app'
    schedule:
      interval: 'monthly'
    cooldown:
      default-days: 7
      exclude:
        - 'com.launchdarkly:*'
